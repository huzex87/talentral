name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talentral
          POSTGRES_PASSWORD: talentral
          POSTGRES_DB: talentral_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talentral" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://talentral:talentral@localhost:5432/talentral_test
      E2E_DATABASE_URL: postgres://talentral:talentral@localhost:5432/talentral_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create the e2e database
        run: PGPASSWORD=talentral psql -h localhost -U talentral -d talentral_test -c "create database talentral_e2e"
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and Row-Level Security tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env: { DATABASE_URL: 'postgres://talentral:talentral@localhost:5432/talentral_e2e' }
      - name: End-to-end tests
        run: |
          pnpm --filter @talentral/web exec playwright install --with-deps chromium
          pnpm --filter @talentral/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results, retention-days: 7 }
